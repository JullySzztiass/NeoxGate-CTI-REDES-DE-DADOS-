<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <style>
      .box-label { font: 700 18px Arial, sans-serif; fill: #1f2937; }
      .mini { font: 700 16px Arial, sans-serif; fill: #0b1f33; }
      .small { font: 600 14px Arial, sans-serif; fill: #1f2937; }
      .tiny { font: 600 12px Arial, sans-serif; fill: #1f2937; }
      .firewall { fill: #f3f6fb; stroke: #6b7280; stroke-width: 1.5; }
      .cloud { fill: #edf8ff; stroke: #60a5fa; stroke-width: 2; }
      .switch { fill: #edf3ff; stroke: #2457b3; stroke-width: 2; }
      .vlan5 { fill: #fef2f2; stroke: #ef4444; stroke-width: 2.5; }
      .vlan8 { fill: #eefcf3; stroke: #22c55e; stroke-width: 2.5; }
      .vlan10 { fill: #fff8df; stroke: #f5b942; stroke-width: 2.5; }
      .servers { fill: #edf5ff; stroke: #3b82f6; stroke-width: 2.3; }
      .legend { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
      .blue { stroke: #1d4ed8; stroke-width: 3; fill: none; }
      .dash { stroke: #6b7280; stroke-width: 2.5; stroke-dasharray: 10 8; fill: none; }
      .red { stroke: #ef4444; stroke-width: 3; fill: none; }
      .green { stroke: #22c55e; stroke-width: 3; fill: none; }
      .amber { stroke: #f59e0b; stroke-width: 3; fill: none; }
      .gray { stroke: #4b5563; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#ffffff"/>

  <rect x="70" y="70" width="200" height="110" rx="12" class="firewall"/>
  <rect x="330" y="70" width="200" height="110" rx="12" class="firewall"/>
  <rect x="770" y="70" width="250" height="110" rx="12" class="cloud"/>

  <g>
    <rect x="118" y="128" width="95" height="26" rx="6" fill="#dfe9ff"/>
    <rect x="378" y="128" width="95" height="26" rx="6" fill="#dfe9ff"/>
    <rect x="822" y="134" width="148" height="18" rx="4" fill="#dbeafe"/>
    <text x="122" y="147" class="mini">🔥</text>
    <text x="148" y="147" class="mini">VPN</text>
    <text x="382" y="147" class="mini">🔥</text>
    <text x="408" y="147" class="mini">VPN</text>
    <text x="850" y="148" class="small">Dados</text>
  </g>

  <text x="103" y="195" class="box-label">Firewall 1</text>
  <text x="370" y="195" class="box-label">Firewall 2</text>
  <text x="802" y="195" class="box-label">AWS - Database</text>

  <line x1="270" y1="124" x2="330" y2="124" class="blue"/>
  <line x1="530" y1="124" x2="770" y2="124" class="dash"/>

  <line x1="170" y1="180" x2="170" y2="260" class="gray"/>
  <line x1="430" y1="180" x2="430" y2="260" class="gray"/>

  <rect x="250" y="260" width="360" height="180" rx="16" class="switch"/>
  <text x="382" y="315" class="box-label">Switch Matriz</text>

  <g>
    <rect x="95" y="450" width="500" height="210" rx="18" class="servers"/>
    <text x="285" y="478" class="box-label">VLAN 3 - Servers</text>
    <rect x="130" y="505" width="180" height="118" rx="12" fill="#f5f9ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="362" y="505" width="180" height="118" rx="12" fill="#f5f9ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="160" y="548" class="small">Linux Server (Ubuntu)</text>
    <text x="392" y="548" class="small">Windows Server</text>
    <text x="165" y="579" class="tiny">Apache</text>
    <text x="330" y="579" class="tiny">MQTT</text>
    <text x="420" y="579" class="tiny">AD DS</text>
    <text x="175" y="603" class="tiny">Zabbix</text>
    <text x="344" y="603" class="tiny">rsyslog</text>
  </g>

  <g>
    <rect x="710" y="260" width="380" height="150" rx="18" class="vlan5"/>
    <text x="812" y="290" class="box-label">VLAN 5 - Colaboradores (VM)</text>
    <rect x="770" y="310" width="110" height="78" rx="10" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5"/>
    <text x="800" y="355" class="small">PC</text>
    <line x1="710" y1="350" x2="770" y2="350" class="red"/>
  </g>

  <g>
    <rect x="710" y="420" width="380" height="150" rx="18" class="vlan8"/>
    <text x="818" y="450" class="box-label">VLAN 8 - TI (VM)</text>
    <rect x="770" y="470" width="110" height="78" rx="10" fill="#f8fafc" stroke="#22c55e" stroke-width="1.5"/>
    <text x="800" y="515" class="small">PC</text>
    <line x1="710" y1="510" x2="770" y2="510" class="green"/>
  </g>

  <g>
    <rect x="710" y="585" width="380" height="180" rx="18" class="vlan10"/>
    <text x="820" y="615" class="box-label">VLAN 10 - IoT (VM)</text>
    <rect x="770" y="635" width="110" height="90" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="930" y="635" width="110" height="90" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="792" y="690" class="small">ESP32</text>
    <text x="952" y="690" class="small">ESP32</text>
    <line x1="710" y1="680" x2="770" y2="680" class="amber"/>
    <circle cx="755" cy="677" r="18" fill="#f5f5f5" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="915" cy="677" r="18" fill="#f5f5f5" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <g>
    <line x1="610" y1="350" x2="710" y2="350" class="red"/>
    <line x1="610" y1="510" x2="710" y2="510" class="green"/>
    <line x1="610" y1="680" x2="710" y2="680" class="amber"/>
  </g>

  <g>
    <text x="120" y="284" class="small">SNMP</text>
    <text x="435" y="295" class="small">SNMP</text>
    <text x="640" y="540" class="small">MQTT</text>
    <text x="640" y="560" class="small">syslog</text>
  </g>

  <g>
    <rect x="820" y="780" width="275" height="60" rx="12" class="legend"/>
    <text x="875" y="810" class="small">Legenda</text>
    <line x1="840" y1="820" x2="905" y2="820" class="blue"/>
    <text x="915" y="826" class="tiny">Rede / Trunk</text>
    <line x1="840" y1="834" x2="905" y2="834" class="dash"/>
    <text x="915" y="840" class="tiny">SNMP</text>
  </g>

  <g>
    <rect x="85" y="690" width="250" height="110" rx="14" fill="#f5f5f5" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="130" y="720" class="small">Sensores</text>
    <circle cx="140" cy="755" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="200" cy="755" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="260" cy="755" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="128" y="790" class="tiny">PIR</text>
    <text x="188" y="790" class="tiny">Luz</text>
    <text x="238" y="790" class="tiny">Ultrassônico</text>
  </g>
</svg>
