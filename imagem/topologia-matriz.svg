<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f3f4f6; stroke: #b5bbc5; stroke-width: 1.5; }
      .firewall { fill: #f3f6fb; stroke: #8a8f99; stroke-width: 1.5; }
      .cloud { fill: #ecf7ff; stroke: #4a9de8; stroke-width: 2; }
      .switch-box { fill: #edf4ff; stroke: #2d5ec6; stroke-width: 2; }
      .server-box { fill: #edf5ff; stroke: #3b82f6; stroke-width: 2; }
      .vlan5 { fill: #fdecec; stroke: #f15050; stroke-width: 2.5; }
      .vlan8 { fill: #edfdf1; stroke: #34b75a; stroke-width: 2.5; }
      .vlan10 { fill: #fff9df; stroke: #f0b93d; stroke-width: 2.5; }
      .legend-box { fill: #f8fafc; stroke: #d1d5db; stroke-width: 1.5; }
      .title { font: 700 20px Arial, sans-serif; fill: #1f2937; }
      .label { font: 700 17px Arial, sans-serif; fill: #1f2937; }
      .small { font: 600 14px Arial, sans-serif; fill: #1f2937; }
      .tiny { font: 600 12px Arial, sans-serif; fill: #1f2937; }
      .blue { stroke: #1e4ed8; stroke-width: 3; fill: none; }
      .dash { stroke: #5f6470; stroke-width: 2.5; stroke-dasharray: 9 8; fill: none; }
      .red { stroke: #ef4444; stroke-width: 3; fill: none; }
      .green { stroke: #22c55e; stroke-width: 3; fill: none; }
      .amber { stroke: #f59e0b; stroke-width: 3; fill: none; }
      .gray { stroke: #4b5563; stroke-width: 2.5; fill: none; }
      .blue-tag { fill: #e9f0ff; stroke: #1d4ed8; stroke-width: 1; }
      .green-tag { fill: #e9fff4; stroke: #22c55e; stroke-width: 1; }
      .amber-tag { fill: #fff6dd; stroke: #f5b942; stroke-width: 1; }
      .server-card { fill: #f8fbff; stroke: #b9cde7; stroke-width: 1.5; }
      .iot-card { fill: #f8fafc; stroke: #f5b942; stroke-width: 1.5; }
      .switch-device { fill: #2a4b8d; }
    </style>
  </defs>

  <rect width="1200" height="860" class="bg"/>

  <g>
    <rect x="70" y="70" width="200" height="110" rx="12" class="firewall"/>
    <rect x="330" y="70" width="200" height="110" rx="12" class="firewall"/>
    <rect x="770" y="70" width="250" height="110" rx="12" class="cloud"/>

    <g>
      <rect x="120" y="126" width="100" height="26" rx="5" class="blue-tag"/>
      <rect x="380" y="126" width="100" height="26" rx="5" class="blue-tag"/>
      <rect x="824" y="134" width="150" height="18" rx="4" fill="#d9ebff"/>
      <text x="146" y="144" class="label">🔥</text>
      <text x="170" y="145" class="small">VPN</text>
      <text x="406" y="145" class="label">🔥</text>
      <text x="430" y="145" class="small">VPN</text>
      <text x="865" y="148" class="small">Dados</text>
    </g>

    <text x="105" y="195" class="title">Firewall 1</text>
    <text x="364" y="195" class="title">Firewall 2</text>
    <text x="793" y="195" class="title">AWS - Database</text>

    <line x1="270" y1="124" x2="330" y2="124" class="blue"/>
    <line x1="530" y1="124" x2="770" y2="124" class="dash"/>

    <line x1="170" y1="180" x2="170" y2="260" class="gray"/>
    <line x1="430" y1="180" x2="430" y2="260" class="gray"/>
  </g>

  <g>
    <rect x="250" y="260" width="360" height="180" rx="16" class="switch-box"/>
    <text x="382" y="318" class="title">Switch Matriz</text>

    <g transform="translate(340 278)">
      <rect x="0" y="0" width="150" height="56" rx="6" fill="#e9f1ff" stroke="#7aa7d8" stroke-width="1.2"/>
      <g>
        <rect x="12" y="18" width="18" height="18" rx="3" class="switch-device"/>
        <rect x="38" y="18" width="18" height="18" rx="3" class="switch-device"/>
        <rect x="64" y="18" width="18" height="18" rx="3" class="switch-device"/>
        <rect x="90" y="18" width="18" height="18" rx="3" class="switch-device"/>
        <rect x="116" y="18" width="18" height="18" rx="3" class="switch-device"/>
      </g>
    </g>

    <line x1="610" y1="350" x2="710" y2="350" class="red"/>
    <line x1="610" y1="510" x2="710" y2="510" class="green"/>
    <line x1="610" y1="680" x2="710" y2="680" class="amber"/>
  </g>

  <g>
    <rect x="95" y="450" width="500" height="210" rx="18" class="server-box"/>
    <text x="285" y="478" class="title">VLAN 3 - Servers</text>

    <rect x="130" y="505" width="180" height="118" rx="12" class="server-card"/>
    <rect x="362" y="505" width="180" height="118" rx="12" class="server-card"/>

    <text x="154" y="548" class="small">Linux Server (Ubuntu)</text>
    <text x="390" y="548" class="small">Windows Server</text>

    <text x="165" y="579" class="tiny">Apache</text>
    <text x="330" y="579" class="tiny">MQTT</text>
    <text x="420" y="579" class="tiny">AD DS</text>
    <text x="175" y="603" class="tiny">Zabbix</text>
    <text x="344" y="603" class="tiny">rsyslog</text>
  </g>

  <g>
    <rect x="710" y="260" width="380" height="150" rx="18" class="vlan5"/>
    <text x="810" y="290" class="title">VLAN 5 - Colaboradores (VM)</text>
    <rect x="770" y="310" width="110" height="78" rx="10" fill="#f8fafc" stroke="#ef4444" stroke-width="1.5"/>
    <text x="800" y="356" class="small">PC</text>
    <line x1="710" y1="350" x2="770" y2="350" class="red"/>
  </g>

  <g>
    <rect x="710" y="420" width="380" height="150" rx="18" class="vlan8"/>
    <text x="826" y="450" class="title">VLAN 8 - TI (VM)</text>
    <rect x="770" y="470" width="110" height="78" rx="10" fill="#f8fafc" stroke="#22c55e" stroke-width="1.5"/>
    <text x="800" y="516" class="small">PC</text>
    <line x1="710" y1="510" x2="770" y2="510" class="green"/>
  </g>

  <g>
    <rect x="710" y="585" width="380" height="180" rx="18" class="vlan10"/>
    <text x="820" y="615" class="title">VLAN 10 - IoT (VM)</text>

    <rect x="770" y="635" width="110" height="90" rx="10" class="iot-card"/>
    <rect x="930" y="635" width="110" height="90" rx="10" class="iot-card"/>

    <text x="795" y="690" class="small">ESP32</text>
    <text x="952" y="690" class="small">ESP32</text>
    <line x1="710" y1="680" x2="770" y2="680" class="amber"/>

    <circle cx="757" cy="677" r="18" fill="#f7f7f7" stroke="#f5b942" stroke-width="2"/>
    <circle cx="915" cy="677" r="18" fill="#f7f7f7" stroke="#f5b942" stroke-width="2"/>
  </g>

  <g>
    <text x="120" y="284" class="small">SNMP</text>
    <text x="435" y="295" class="small">SNMP</text>
    <text x="640" y="540" class="small">MQTT</text>
    <text x="640" y="560" class="small">syslog</text>
  </g>

  <g>
    <rect x="820" y="780" width="275" height="60" rx="12" class="legend-box"/>
    <text x="896" y="810" class="small">Legenda</text>

    <line x1="840" y1="820" x2="905" y2="820" class="blue"/>
    <text x="915" y="826" class="tiny">Rede / Trunk</text>

    <line x1="840" y1="834" x2="905" y2="834" class="dash"/>
    <text x="915" y="840" class="tiny">SNMP</text>

    <line x1="840" y1="848" x2="905" y2="848" class="gray"/>
    <text x="915" y="854" class="tiny">syslog</text>
  </g>

  <g>
    <rect x="90" y="690" width="250" height="110" rx="14" fill="#f5f5f5" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="135" y="720" class="small">Sensores</text>
    <circle cx="140" cy="755" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="200" cy="755" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="260" cy="755" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="128" y="790" class="tiny">PIR</text>
    <text x="188" y="790" class="tiny">Luz</text>
    <text x="238" y="790" class="tiny">Ultrassônico</text>
  </g>
</svg>
